title: "Section by Object"
tooltip: "In a floor, ceiling or structural plan: click an edge of any object — in this model or straight into a link, no need to click into the link first — then click the side to look from. Creates a section running along that edge, as long as the object plus an offset at each end, with the top and bottom taken from the plan's view range, and opens it. Shift+Click to set the section view type and the offset."
